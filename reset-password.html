<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password · N-DFIP</title>
    <link rel="stylesheet" href="./styles/shared.css" />
    <script src="./scripts/db.js"></script>
    <script src="./scripts/auth.js"></script>
    <script src="./scripts/staff.js"></script>
    <script src="./scripts/access.js"></script>
    <script src="./scripts/org.js"></script>
    <script src="./scripts/audit.js"></script>
  </head>
  <body>
    <main class="auth-page">
      <div class="brand-lockup">
        <p class="brand-lockup__abbr">N-DFIP</p>
        <h1 class="app-title">National Diabetic Foot Intelligence Platform</h1>
      </div>

      <div class="card">
        <!-- Valid link: choose a new password -->
        <div id="reset-view" hidden>
          <div class="card-header">
            <h2 class="card-title">Choose a new password</h2>
            <p class="card-description" id="reset-for"></p>
          </div>
          <div class="card-content">
            <form class="form" id="reset-form" novalidate>
              <div class="field">
                <label class="label" for="new-password">New password</label>
                <input class="input" id="new-password" type="password" autocomplete="new-password" aria-describedby="password-rules" />
                <p class="field-error" id="new-password-error" hidden>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></svg>
                  <span></span>
                </p>
                <ul class="password-rules" id="password-rules" aria-label="Password rules"></ul>
              </div>
              <div class="field">
                <label class="label" for="confirm-password">Confirm new password</label>
                <input class="input" id="confirm-password" type="password" autocomplete="new-password" />
                <p class="field-error" id="confirm-password-error" hidden>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></svg>
                  <span></span>
                </p>
              </div>
              <div class="checkbox-row">
                <input class="checkbox" type="checkbox" id="show-passwords" />
                <label class="label label--normal" for="show-passwords">Show passwords</label>
              </div>
              <p class="field-error" id="reset-error" role="alert" hidden>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></svg>
                <span></span>
              </p>
              <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Set new password</button>
            </form>
          </div>
        </div>

        <!-- Result: done, used, expired or unknown link -->
        <div id="result-view" hidden>
          <div class="card-header">
            <h2 class="card-title" id="result-title"></h2>
            <p class="card-description" id="result-text"></p>
          </div>
          <div class="card-content result-actions">
            <a class="btn btn-primary btn-block" href="./ndfip-login-preview.html" id="result-signin">Go to sign in</a>
          </div>
        </div>
      </div>

      <p class="page-note">Prototype — not for clinical use.</p>
    </main>

    <script>
      (() => {
        const token = new URLSearchParams(location.search).get("token");
        const $ = (id) => document.getElementById(id);

        const RESULTS = {
          unknown: ["This link isn't valid", "The reset link is incomplete or doesn't exist. Ask for a new one from the sign-in page (Forgot password?) or from your administrator."],
          used: ["This link was already used", "A reset link works only once. If you didn't change your password, ask for a new link and tell your administrator."],
          expired: ["This link has expired", `Reset links expire ${Auth.RESET_MINUTES} minutes after they're sent. Ask for a new one from the sign-in page (Forgot password?).`],
          done: ["Password changed", "Your new password is set and any other sessions on your account were signed out. Sign in with the new password."],
        };

        function showResult(kind) {
          $("reset-view").hidden = true;
          $("result-view").hidden = false;
          $("result-title").textContent = RESULTS[kind][0];
          $("result-text").textContent = RESULTS[kind][1];
          if (kind === "done") $("result-signin").href = "./ndfip-login-preview.html?reason=changed";
          $("result-title").setAttribute("tabindex", "-1");
          $("result-title").focus();
        }

        const check = Auth.checkResetToken(token);
        if (!check.ok) {
          showResult(check.reason);
          return;
        }
        $("reset-view").hidden = false;
        $("reset-for").textContent = `For ${check.name} (employee ID ${check.userId}). This link works once.`;

        const pw = $("new-password");
        const confirm = $("confirm-password");
        const rules = $("password-rules");
        for (const rule of Auth.PASSWORD_RULES) {
          const li = document.createElement("li");
          li.dataset.rule = rule.id;
          li.textContent = rule.text;
          rules.append(li);
        }
        const paintRules = () => {
          for (const rule of Auth.PASSWORD_RULES) rules.querySelector(`[data-rule="${rule.id}"]`).classList.toggle("is-met", rule.test(pw.value));
        };

        function setError(id, message) {
          const err = $(`${id}-error`);
          err.hidden = !message;
          err.querySelector("span").textContent = message ?? "";
          const input = $(id);
          if (!input) return;
          if (message) input.setAttribute("aria-invalid", "true");
          else input.removeAttribute("aria-invalid");
        }

        pw.addEventListener("input", () => {
          paintRules();
          setError("new-password", null);
          setError("reset", null);
        });
        confirm.addEventListener("input", () => setError("confirm-password", null));
        $("show-passwords").addEventListener("change", (e) => {
          pw.type = confirm.type = e.target.checked ? "text" : "password";
        });
        paintRules();

        $("reset-form").addEventListener("submit", (event) => {
          event.preventDefault();
          setError("new-password", null);
          setError("confirm-password", null);
          setError("reset", null);
          const missing = Auth.PASSWORD_RULES.filter((r) => !r.test(pw.value));
          if (!pw.value) setError("new-password", "Enter a new password.");
          else if (missing.length) setError("new-password", `The password still needs: ${missing.map((r) => r.text.toLowerCase()).join("; ")}.`);
          if (!confirm.value) setError("confirm-password", "Enter the new password again.");
          else if (pw.value && confirm.value !== pw.value) setError("confirm-password", "The two passwords don't match.");
          if (!$("new-password-error").hidden) return pw.focus();
          if (!$("confirm-password-error").hidden) return confirm.focus();

          const submit = $("reset-submit");
          submit.disabled = true;
          let result;
          try {
            result = Auth.completeReset(token, pw.value);
          } catch (e) {
            setError("reset", e?.message ?? "The password couldn't be saved. Try again.");
            submit.disabled = false;
            return;
          }
          submit.disabled = false;
          if (result.ok) return showResult("done");
          if (result.reason === "same") {
            setError("new-password", "Choose a password different from your current one.");
            return pw.focus();
          }
          if (result.reason === "weak") {
            setError("new-password", "The password doesn't meet the rules below.");
            return pw.focus();
          }
          showResult(result.reason);
        });
      })();
    </script>
  </body>
</html>
