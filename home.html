<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="./styles/shared.css" />
    <script src="./scripts/auth.js"></script>
    <script>
      // Not signed in: back to the sign-in page
      if (!Auth.getSessionId()) window.location.replace(Auth.LOGIN_PAGE);
    </script>
  </head>
  <body>
    <header class="app-header">
      <a class="app-title" href="./home.html">The Clinical Platform</a>

      <nav class="app-nav" aria-label="Main">
        <a href="./home.html" aria-current="page">Home</a>
        <a href="./dashboard.html">Dashboard</a>
        <a href="./settings.html">Settings</a>
      </nav>

      <div class="user-menu">
        <button
          type="button"
          class="avatar-button"
          id="user-menu-button"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="user-menu"
          aria-label="Open user menu"
        >
          <span id="user-initials">?</span>
        </button>

        <div class="menu" id="user-menu" role="menu" aria-labelledby="user-menu-button" hidden>
          <button type="button" class="menu-item" role="menuitem" data-action="account">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
            Account
          </button>
          <button type="button" class="menu-item" role="menuitem" data-action="settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
            Settings
          </button>
          <hr class="menu-separator" role="separator" />
          <button type="button" class="menu-item menu-item--destructive" role="menuitem" data-action="logout">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></svg>
            Log out
          </button>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <h1 class="page-title">Welcome <span id="welcome-name"></span></h1>
        <p class="page-subtitle">
          Today is <time id="today-date"></time> - <time id="today-time"></time>
        </p>
      </div>

      <section class="page-section" aria-labelledby="clinics-heading">
        <h2 class="section-title" id="clinics-heading">Clinics</h2>

        <div class="module-grid">
          <a class="module-card" href="./diabetic-foot.html">
            <div class="module-card__icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" /><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" /><path d="M16 17h4" /><path d="M4 13h4" /></svg>
            </div>
            <h3 class="module-card__title">Diabetic Foot</h3>
            <p class="module-card__excerpt">Structured foot screening by trained staff, prepared for practitioner review. One connected record supporting prevention, continuity and limb preservation.</p>
            <span class="module-card__cta">
              Open clinic
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
            </span>
          </a>
        </div>
      </section>
    </main>

    <script src="./scripts/user-menu.js"></script>
    <script>
      const user = Auth.findUser(Auth.getSessionId());
      if (user) document.getElementById("welcome-name").textContent = user.name;

      // "Today is Sunday, October 4, 2026 - 01:05 PM" (12-hour, leading zero)
      const pad = (n) => String(n).padStart(2, "0");
      const dateEl = document.getElementById("today-date");
      const timeEl = document.getElementById("today-time");

      function renderClock() {
        const now = new Date();
        const hours = now.getHours() % 12 || 12;
        const period = now.getHours() < 12 ? "AM" : "PM";
        dateEl.textContent = now.toLocaleDateString("en-US", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });
        dateEl.dateTime = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        timeEl.textContent = `${pad(hours)}:${pad(now.getMinutes())} ${period}`;
        timeEl.dateTime = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      }

      renderClock();
      // Tick on each minute boundary
      setTimeout(() => {
        renderClock();
        setInterval(renderClock, 60_000);
      }, 60_000 - (Date.now() % 60_000));
    </script>
  </body>
</html>
