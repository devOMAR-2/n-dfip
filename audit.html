<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit log · N-DFIP</title>
    <link rel="stylesheet" href="./styles/shared.css" />
    <script src="./scripts/db.js"></script>
    <script src="./scripts/auth.js"></script>
    <script src="./scripts/staff.js"></script>
    <script src="./scripts/access.js"></script>
    <script src="./scripts/org.js"></script>
    <script src="./scripts/audit.js"></script>
    <script src="./scripts/privacy.js"></script>
    <script src="./scripts/history-seed.js"></script>
    <script src="./scripts/referrals.js"></script>
    <script src="./scripts/tests.js"></script>
    <script src="./scripts/session.js"></script>
    <script src="./scripts/privacy-ui.js"></script>
    <script src="./scripts/notifications.js"></script>
    <script>
      // Not signed in: back to the sign-in page
      if (!Auth.getSessionId()) window.location.replace(Auth.LOGIN_PAGE);
      // Role check (F-01): shows a "no access" page instead of the content
      Access.guardPage(["audit.view"], "the audit log");
    </script>
  </head>
  <body>
    <header class="app-header">
      <a class="app-title" href="./home.html" aria-label="N-DFIP, National Diabetic Foot Intelligence Platform, home"><span class="app-title__short">N-DFIP</span><span class="app-title__full">National Diabetic Foot Intelligence Platform</span></a>

      <nav class="app-nav" aria-label="Main">
        <a href="./home.html">Home</a>
        <a href="./patients.html">Patients</a>
        <a href="./referrals.html">Referrals</a>
        <a href="./dashboard.html">Dashboard</a>
        <a href="./audit.html" aria-current="page">Audit log</a>
        <a href="./settings.html">Settings</a>
      </nav>

      <div class="user-menu">
        <button
          type="button"
          class="avatar-button"
          id="user-menu-button"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="user-menu"
          aria-label="Open user menu"
        >
          <span id="user-initials">?</span>
        </button>

        <div class="menu" id="user-menu" role="menu" aria-labelledby="user-menu-button" hidden>
          <button type="button" class="menu-item" role="menuitem" data-action="account">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
            Account
          </button>
          <button type="button" class="menu-item" role="menuitem" data-action="settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
            Settings
          </button>
          <hr class="menu-separator" role="separator" />
          <button type="button" class="menu-item menu-item--destructive" role="menuitem" data-action="logout">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></svg>
            Log out
          </button>
        </div>
      </div>
    </header>

    <main class="page-content">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="./home.html">Home</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">Audit log</span>
      </nav>

      <div class="page-header page-header--split">
        <div>
          <h1 class="page-title">Audit log</h1>
          <p class="page-subtitle" id="audit-scope"></p>
        </div>
        <button type="button" class="btn btn-outline" id="audit-export" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></svg>
          Export CSV
        </button>
      </div>

      <div class="callout audit-readonly">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
        <div><strong>Read only</strong><p>Entries can't be edited or deleted by anyone, including the system administrator. Every new event is added at the top.</p></div>
      </div>

      <form class="audit-filters settings-card" id="audit-filters" novalidate>
        <div class="field">
          <label class="label" for="f-user">User</label>
          <select class="input select" id="f-user"><option value="">Everyone</option></select>
        </div>
        <div class="field">
          <label class="label" for="f-patient">Patient or record</label>
          <input class="input" id="f-patient" placeholder="File number, e.g. N-DFIP-004742" autocomplete="off" />
        </div>
        <div class="field">
          <label class="label" for="f-type">Action type</label>
          <select class="input select" id="f-type"><option value="">All actions</option></select>
        </div>
        <div class="field">
          <label class="label" for="f-from">From</label>
          <input class="input" id="f-from" type="date" />
        </div>
        <div class="field">
          <label class="label" for="f-to">To</label>
          <input class="input" id="f-to" type="date" />
          <p class="field-error" id="f-to-error" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></svg>
            <span></span>
          </p>
        </div>
        <div class="field">
          <label class="label" for="f-facility">Facility</label>
          <select class="input select" id="f-facility"><option value="">All facilities in scope</option></select>
        </div>
        <div class="field">
          <label class="label" for="f-clinic">Clinic</label>
          <select class="input select" id="f-clinic"><option value="">All clinics in scope</option></select>
        </div>
        <div class="checkbox-row audit-filters__flag">
          <input class="checkbox" type="checkbox" id="f-flagged" />
          <label class="label label--normal" for="f-flagged">Only entries flagged for review</label>
        </div>
        <div class="audit-filters__actions">
          <button type="reset" class="btn btn-ghost btn-sm" id="f-clear">Clear filters</button>
        </div>
      </form>

      <p class="audit-count" id="audit-count" aria-live="polite"></p>
      <div id="audit-results"></div>
    </main>

    <script src="./scripts/user-menu.js"></script>
    <script src="./scripts/audit-page.js"></script>
  </body>
</html>
